[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sla-layer-partition-sensitivity"
version = "0.1.0"
description = "Self-contained phase-1 screening of SLA-safe capacity sensitivity to continuous layer partitions"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
run-phase1 = "sla_partition_sensitivity.experiment:main"

[tool.setuptools.packages.find]
where = ["src"]

