name: phase6-helix-profiled-heterogeneity

on:
  push:
    branches: [main]
    paths:
      - 'src/sla_partition_sensitivity/helix_profile.py'
      - 'src/sla_partition_sensitivity/profiled_model.py'
      - 'src/sla_partition_sensitivity/phase6_profiled.py'
      - 'config/phase6.json'
      - 'data/helix_profiles/**'
      - 'tests/test_phase6_profiled.py'
      - '.github/workflows/phase6-profiled.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Run validation suite
        run: python -m unittest discover -s tests -v
      - name: Run HELIX-profile phase-specific experiment
        run: python -m sla_partition_sensitivity.phase6_profiled --config config/phase6.json --output results/phase6
      - name: Show phase-6 conclusion
        run: cat results/phase6/summary.json
      - name: Upload complete phase-6 record
        uses: actions/upload-artifact@v4
        with:
          name: phase6-helix-profiled-results
          path: results/phase6/
          if-no-files-found: error
      - name: Record deterministic phase-6 results
        run: |
          if [ -n "$(git status --porcelain results/phase6)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add results/phase6
            git commit -m "Record phase-6 HELIX-profile results [skip ci]"
            git push
          else
            echo "No phase-6 result changes to commit."
          fi
