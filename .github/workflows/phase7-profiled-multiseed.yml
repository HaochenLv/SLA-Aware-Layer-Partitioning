name: phase7-helix-profiled-six-seed

on:
  push:
    branches: [main]
    paths:
      - 'src/sla_partition_sensitivity/helix_profile.py'
      - 'src/sla_partition_sensitivity/profiled_model.py'
      - 'src/sla_partition_sensitivity/phase6_profiled.py'
      - 'src/sla_partition_sensitivity/phase7_multiseed_profiled.py'
      - 'config/phase7.json'
      - 'data/helix_profiles/**'
      - 'tests/test_phase7_multiseed_profiled.py'
      - '.github/workflows/phase7-profiled-multiseed.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Run validation suite
        run: python -m unittest discover -s tests -v
      - name: Run six-seed HELIX-profile robustness experiment
        run: python -m sla_partition_sensitivity.phase7_multiseed_profiled --config config/phase7.json --output results/phase7
      - name: Show phase-7 conclusion
        run: cat results/phase7/summary.json
      - name: Upload complete phase-7 record
        uses: actions/upload-artifact@v4
        with:
          name: phase7-helix-profiled-six-seed-results
          path: results/phase7/
          if-no-files-found: error
      - name: Record deterministic phase-7 results
        run: |
          if [ -n "$(git status --porcelain results/phase7)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add results/phase7
            git commit -m "Record phase-7 HELIX-profile six-seed results [skip ci]"
            git push
          else
            echo "No phase-7 result changes to commit."
          fi
