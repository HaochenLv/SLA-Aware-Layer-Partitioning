name: phase4-reduced-exhaustive-oracle

on:
  push:
    branches: [main]
    paths:
      - 'src/sla_partition_sensitivity/phase4_oracle.py'
      - 'src/sla_partition_sensitivity/phase3.py'
      - 'src/sla_partition_sensitivity/model.py'
      - 'config/phase4_oracle.json'
      - 'tests/test_phase4_oracle.py'
      - '.github/workflows/phase4-oracle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Run validation suite
        run: python -m unittest discover -s tests -v
      - name: Run reduced exhaustive oracle
        run: python -m sla_partition_sensitivity.phase4_oracle --config config/phase4_oracle.json --output results/phase4-oracle
      - name: Show oracle conclusion
        run: cat results/phase4-oracle/summary.json
      - name: Upload complete phase-4 record
        uses: actions/upload-artifact@v4
        with:
          name: phase4-reduced-exhaustive-oracle-results
          path: results/phase4-oracle/
          if-no-files-found: error
      - name: Record deterministic phase-4 results
        run: |
          if [ -n "$(git status --porcelain results/phase4-oracle)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add results/phase4-oracle
            git commit -m "Record phase-4 exhaustive oracle results [skip ci]"
            git push
          else
            echo "No phase-4 result changes to commit."
          fi
