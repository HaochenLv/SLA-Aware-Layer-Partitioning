name: phase14-reviewer-revision

on:
  push:
    branches: [reviewer-revision-experiments]
    paths:
      - 'src/sla_partition_sensitivity/phase14_revision_experiments.py'
      - 'src/sla_partition_sensitivity/phase13_evaluator_guided_search.py'
      - 'src/sla_partition_sensitivity/phase11_trace_validation.py'
      - 'src/sla_partition_sensitivity/phase10_method_compare.py'
      - 'src/sla_partition_sensitivity/phase6_profiled.py'
      - 'src/sla_partition_sensitivity/helix_profile.py'
      - 'src/sla_partition_sensitivity/profiled_model.py'
      - 'config/phase14.json'
      - 'data/helix_profiles/**'
      - 'tests/test_phase14_revision_experiments.py'
      - '.github/workflows/phase14-reviewer-revision.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  experiment:
    strategy:
      fail-fast: false
      matrix:
        suite: [expanded, bandwidth]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Fetch pinned HELIX Azure workload artifacts read-only
        run: |
          set -euo pipefail
          mkdir -p data/runtime_helix_trace
          BASE="https://raw.githubusercontent.com/HaochenLv/sla-aware-evaluator/297280c000e45ba6a8fa79135e4bfc4a9e17cb99/data/raw/helix/Helix-ASPLOS25/simulator/trace_generator"
          curl -fL "$BASE/arrival_rate/azure_conv_arrive_time.pkl" -o data/runtime_helix_trace/azure_conv_arrive_time.pkl
          curl -fL "$BASE/length_data/azure_conv_input.pkl" -o data/runtime_helix_trace/azure_conv_input.pkl
          curl -fL "$BASE/length_data/azure_conv_output.pkl" -o data/runtime_helix_trace/azure_conv_output.pkl
          echo "1ae6dec376d39a7c9fa7ed8239cf5b10b5349b540697c94df8d1d1055b35f2a3  data/runtime_helix_trace/azure_conv_arrive_time.pkl" | sha256sum -c -
          echo "090770d895fe96d733f4c1d2e0068b5d391f565f25d05841077063c0c344c92f  data/runtime_helix_trace/azure_conv_input.pkl" | sha256sum -c -
          echo "4d42ec92d42a36cdf647af81fc5f7f8627ff4c21bddee24902f25d013dbadd82  data/runtime_helix_trace/azure_conv_output.pkl" | sha256sum -c -
      - name: Run focused revision tests
        run: |
          python -m unittest tests.test_phase14_revision_experiments -v
          python -m unittest tests.test_phase13_evaluator_guided_search -v
      - name: Run revision suite
        run: >-
          python -m sla_partition_sensitivity.phase14_revision_experiments
          --config config/phase14.json
          --suite ${{ matrix.suite }}
          --output results/phase14/${{ matrix.suite }}
      - name: Show revision summary
        run: cat results/phase14/${{ matrix.suite }}/summary.json
      - name: Upload complete revision record
        uses: actions/upload-artifact@v4
        with:
          name: phase14-${{ matrix.suite }}-results
          path: results/phase14/${{ matrix.suite }}/
          if-no-files-found: error

  record-results:
    needs: experiment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reviewer-revision-experiments
      - name: Download expanded results
        uses: actions/download-artifact@v4
        with:
          name: phase14-expanded-results
          path: results/phase14/expanded
      - name: Download bandwidth results
        uses: actions/download-artifact@v4
        with:
          name: phase14-bandwidth-results
          path: results/phase14/bandwidth
      - name: Record deterministic reviewer-revision results
        run: |
          if [ -n "$(git status --porcelain results/phase14)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add results/phase14
            git commit -m "Record phase-14 reviewer revision results [skip ci]"
            git push origin reviewer-revision-experiments
          else
            echo "No phase-14 result changes to commit."
          fi
