name: phase9-helix-sla-crossover

on:
  push:
    branches: [main]
    paths:
      - 'src/sla_partition_sensitivity/phase9_crossover.py'
      - 'src/sla_partition_sensitivity/phase6_profiled.py'
      - 'src/sla_partition_sensitivity/helix_profile.py'
      - 'src/sla_partition_sensitivity/profiled_model.py'
      - 'config/phase9_crossover.json'
      - 'tests/test_phase9_crossover.py'
      - '.github/workflows/phase9-crossover.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Run phase-9 focused tests
        run: python -m unittest tests.test_phase9_crossover -v
      - name: Run crossover localization
        run: python -m sla_partition_sensitivity.phase9_crossover --config config/phase9_crossover.json --output results/phase9-crossover
      - name: Show phase-9 conclusion
        run: cat results/phase9-crossover/summary.json
      - name: Upload complete phase-9 record
        uses: actions/upload-artifact@v4
        with:
          name: phase9-helix-sla-crossover-results
          path: results/phase9-crossover/
          if-no-files-found: error
      - name: Record deterministic phase-9 results
        run: |
          if [ -n "$(git status --porcelain results/phase9-crossover)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add results/phase9-crossover
            git commit -m "Record phase-9 crossover results [skip ci]"
            git push
          else
            echo "No phase-9 result changes to commit."
          fi
