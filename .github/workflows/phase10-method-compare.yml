name: phase10-helix-method-compare

on:
  push:
    branches: [main]
    paths:
      - 'src/sla_partition_sensitivity/phase10_method_compare.py'
      - 'src/sla_partition_sensitivity/phase6_profiled.py'
      - 'src/sla_partition_sensitivity/helix_profile.py'
      - 'src/sla_partition_sensitivity/profiled_model.py'
      - 'config/phase10.json'
      - 'data/helix_profiles/**'
      - 'tests/test_phase10_method_compare.py'
      - '.github/workflows/phase10-method-compare.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Run phase-10 focused tests
        run: python -m unittest tests.test_phase10_method_compare -v
      - name: Run HELIX method comparison
        run: python -m sla_partition_sensitivity.phase10_method_compare --config config/phase10.json --output results/phase10
      - name: Show phase-10 conclusion
        run: cat results/phase10/summary.json
      - name: Upload complete phase-10 record
        uses: actions/upload-artifact@v4
        with:
          name: phase10-helix-method-comparison-results
          path: results/phase10/
          if-no-files-found: error
      - name: Record deterministic phase-10 results
        run: |
          if [ -n "$(git status --porcelain results/phase10)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add results/phase10
            git commit -m "Record phase-10 method-comparison results [skip ci]"
            git push
          else
            echo "No phase-10 result changes to commit."
          fi
